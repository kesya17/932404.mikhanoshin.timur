<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Миханошин Тимур. Студент-разработчик</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <header>
            <img src="photo.jpg" alt="Моё фото" width="250" />
            <h1>Миханошин Тимур</h1>
            <p>Студент-разработчик</p>
        </header>

        <main>
            <section>
                <h2>Навыки</h2>
                <ul>
                    <li>C#</li>
                    <li>Python</li>
                    <li>C</li>
                </ul>
            </section>

            <section>
                <h2>Проекты</h2>
                <ol>
                    <li>Блокнот</li>
                    <li>Крестики-Нолики</li>
                    <li>Калькулятор облигаций</li>
                </ol>
            </section>

            <aside>
                <h2>Любимые инструменты</h2>
                <p>Linux, VS Code, Git</p>
            </aside>

            <section>
                <h2>Обратная связь</h2>
                <form>
                    <label for="name">Имя:</label>
                    <input
                        type="text"
                        name="name"
                        id="name"
                        placeholder="Введите ваше имя"
                    />

                    <label for="email">Email:</label>
                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Введите ваш email"
                    />

                    <label for="message">Сообщение:</label>
                    <textarea
                        name="message"
                        id="message"
                        placeholder="Напишите сообщение"
                    ></textarea>

                    <button type="submit">Отправить</button>
                </form>
            </section>
        </main>

        <footer>
            <p>© 2026 Миханошин Тимур</p>
        </footer>
    </body>
</html>
